<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F4F5F7">
<title>Penderie</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Penderie">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
html,body{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden;max-width:100%}
:root{
  --bg:#F4F5F7; --surface:#FFFFFF; --surface-2:#ECEEF2; --ink:#141B2B; --ink-2:#3A4356; --muted:#6E7789; --line:#DDE1E8;
  --navy:#1F3358; --on-navy:#FFFFFF; --stitch:#D99A1E; --stitch-soft:#F6E7C6; --danger:#B3362F; --ok:#2E7D4F;
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06);
  --font:"Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --serif:"DM Serif Display", Georgia, serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0E131D;--surface:#171E2B;--surface-2:#202839;--ink:#EBEEF4;--ink-2:#C3C9D6;--muted:#8F99AD;--line:#2A3346;--navy:#8FB0E6;--on-navy:#0B1220;--stitch:#E8B24A;--stitch-soft:#3A3020;--danger:#EE7A72;--ok:#6CC495;--shadow:0 1px 2px rgba(0,0,0,.4)}
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
img{max-width:100%;display:block}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
svg{flex:none}
:focus-visible{outline:2.5px solid var(--stitch);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1040px;margin:0 auto;padding:8px 18px calc(110px + env(safe-area-inset-bottom,0px))}

/* Header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:18px 0 14px}
.brand h1{font-size:clamp(2.3rem,8vw,3.4rem);line-height:.92;margin:0;font-weight:800;letter-spacing:-.035em}
.brand p{margin:8px 0 0;color:var(--muted);font-size:.95rem}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.stats{display:flex;gap:18px;text-align:right}
.stat b{display:block;font-size:1.5rem;line-height:1;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--muted)}
.acct{border:0;background:var(--surface-2);border-radius:50%;width:38px;height:38px;padding:0;overflow:hidden;display:grid;place-items:center;font-weight:700;color:var(--ink-2)}
.acct img{width:100%;height:100%;object-fit:cover}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted);margin-top:8px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.sync.off i{background:var(--danger)}

/* Bottom tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 10px env(safe-area-inset-bottom,0px)}
.tabbar-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr auto 1fr;align-items:center;gap:4px}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px 8px;font-size:.74rem;font-weight:600;color:var(--muted);border-radius:12px}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"] svg{stroke:var(--navy)}
.tab span{white-space:nowrap}
.tab .n{font-variant-numeric:tabular-nums}
.add{border:0;background:var(--navy);color:var(--on-navy);border-radius:16px;height:50px;padding:0 18px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:.95rem;margin:0 6px;box-shadow:0 6px 16px rgba(31,51,88,.28)}

/* Toolbar */
.toolbar{display:flex;flex-direction:column;gap:10px;margin-bottom:6px}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:0 14px;height:46px}
.search input{border:0;background:transparent;outline:none;flex:1;min-width:0;height:100%;font-size:16px}
.search svg{stroke:var(--muted)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:.9rem;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;color:var(--ink-2)}
.chip .c{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.82rem}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.chip[aria-pressed="true"] .c{color:inherit;opacity:.7}
.dot{width:13px;height:13px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(127,127,127,.4);flex:none}

/* Palette */
.palette{background:var(--surface);border-radius:var(--r-md);padding:14px;margin:6px 0 4px;box-shadow:var(--shadow)}
.palette-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.palette-h h2{font-size:1rem;margin:0}
.palette-h span{font-size:.82rem;color:var(--muted)}
.bar{display:flex;height:14px;border-radius:999px;overflow:hidden;gap:2px}
.bar button{border:0;padding:0;min-width:6px}
.bar button.dim{opacity:.25}

/* Sections & étiquettes */
.sect{display:flex;align-items:baseline;gap:8px;margin:22px 0 12px}
.sect h2{font-size:1.2rem;margin:0;letter-spacing:-.01em}
.sect span{color:var(--muted);font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:16px 14px}
.tag{position:relative;background:var(--surface);border:0;border-radius:16px 16px 12px 12px;padding:9px 9px 11px;text-align:left;display:flex;flex-direction:column;gap:9px;box-shadow:var(--shadow);transition:transform .15s}
.tag:active{transform:scale(.98)}
.tag::after{content:"";position:absolute;inset:4px;border:1.3px dashed var(--stitch);border-radius:13px 13px 9px 9px;pointer-events:none;opacity:.7}
.tag .hole{position:absolute;top:-6px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 1.3px var(--line);z-index:1}
.ph{aspect-ratio:3/4;border-radius:9px;overflow:hidden;background:var(--surface-2);position:relative}
.ph img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .25s}
.ph img.ld{opacity:1}
.tag .nm{font-weight:650;font-size:.96rem;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
.tag .meta{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted);padding:0 4px;overflow:hidden;white-space:nowrap}
.skel .ph{animation:pulse 1.4s ease-in-out infinite}
.skel .ln{height:11px;border-radius:6px;background:var(--surface-2);margin:2px 4px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}

/* États vides */
.empty{background:var(--surface);border-radius:var(--r-lg);padding:34px 22px;text-align:center;box-shadow:var(--shadow);margin-top:8px}
.empty svg{stroke:var(--navy);margin:0 auto 12px;display:block}
.empty h3{margin:0 0 6px;font-size:1.25rem}
.empty p{margin:0 auto 18px;color:var(--muted);max-width:34ch}
.steps{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.steps div{background:var(--surface-2);border-radius:12px;padding:8px 12px;font-size:.85rem;color:var(--ink-2)}

/* Boutons */
.btn{border:0;border-radius:var(--r-md);padding:13px 18px;font-weight:700;background:var(--navy);color:var(--on-navy);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px}
.btn.sec{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.danger{background:transparent;color:var(--danger);box-shadow:inset 0 0 0 1px var(--danger)}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn svg{stroke:currentColor}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 180px}

/* Générateur */
.gen{background:var(--surface);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow);margin-top:6px}
.gen h2{margin:0 0 2px;font-size:1.3rem;letter-spacing:-.01em}
.gen>p{margin:0 0 14px;color:var(--muted);font-size:.92rem}
.flt{margin-bottom:12px}
.flt .lbl{font-size:.85rem;font-weight:600;color:var(--ink-2);margin-bottom:6px;display:block}
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:9px 2px;font-size:.84rem;white-space:nowrap;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(16,24,40,.12)}
.gen-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.gen-actions .btn{flex:1 1 200px}
.status{color:var(--muted);font-size:.9rem;margin:12px 0 0;min-height:1.3em}
.results-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:24px 0 12px;flex-wrap:wrap}
.results-h h2{margin:0;font-size:1.2rem}
.view{display:inline-grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:10px;padding:3px}
.view button{border:0;background:transparent;border-radius:8px;padding:7px 14px;font-size:.85rem;font-weight:600;color:var(--muted)}
.view button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(16,24,40,.12)}

/* Carte tenue */
.fits{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.fit{background:var(--surface);border-radius:var(--r-lg);padding:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.lay{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);width:100%;gap:6px;cursor:pointer;border:0;padding:0;background:none;text-align:left}
.lay .col{display:flex;flex-direction:column;gap:6px;min-width:0;min-height:0}
.lay .ph{aspect-ratio:auto;flex:1;min-height:0}
.lay .main .ph{aspect-ratio:1/1}
.lay .side .ph{aspect-ratio:auto;flex:1 1 0;min-height:0}
.lay .side .ph img{object-fit:contain}
.lay .side .ph.ghost{background:repeating-linear-gradient(135deg,var(--surface-2) 0 8px,transparent 8px 16px)}
.lay .lbl{position:absolute;left:6px;bottom:6px;background:rgba(14,19,29,.7);color:#fff;font-size:.7rem;padding:2px 7px;border-radius:999px}
.fit-f{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 2px}
.fit-f h3{margin:0;font-size:1.05rem;line-height:1.2}
.fit-f p{margin:3px 0 0;font-size:.82rem;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.swatches{display:inline-flex}
.swatches i{width:14px;height:14px;border-radius:50%;box-shadow:0 0 0 2px var(--surface),inset 0 0 0 1px rgba(127,127,127,.4);margin-left:-4px}
.swatches i:first-child{margin-left:0}
.heart{border:0;background:var(--surface-2);border-radius:50%;width:42px;height:42px;display:grid;place-items:center;flex:none}
.heart svg{stroke:var(--ink-2);fill:none}
.heart[aria-pressed="true"]{background:var(--stitch-soft)}
.heart[aria-pressed="true"] svg{stroke:var(--stitch);fill:var(--stitch)}
.why{margin:0;font-size:.88rem;color:var(--ink-2);padding:0 2px}
.badge{display:inline-flex;align-items:center;gap:5px;background:var(--surface-2);border-radius:999px;padding:2px 8px;font-size:.75rem;color:var(--ink-2)}

/* Feuille */
.sheet{position:fixed;inset:0;z-index:40;visibility:hidden}
.sheet .scrim{position:absolute;inset:0;background:rgba(8,12,20,.5);opacity:0;transition:opacity .2s}
.panel{position:absolute;left:0;right:0;bottom:0;max-height:94%;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;background:var(--bg);border-radius:22px 22px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet.open{visibility:visible}
.sheet.open .scrim{opacity:1}
.sheet.open .panel{transform:none}
@media (min-width:760px){.panel{left:50%;width:660px;margin-left:-330px;bottom:auto;top:4%;max-height:92%;border-radius:22px;transform:translateY(24px);opacity:0;transition:transform .25s,opacity .2s}.sheet.open .panel{opacity:1}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.sheet-h h2{margin:0;font-size:1.45rem;letter-spacing:-.02em;line-height:1.15}
.iconbtn{width:40px;height:40px;border-radius:50%;border:0;background:var(--surface-2);display:grid;place-items:center;flex:none}
.iconbtn svg{stroke:var(--ink)}
.stepn{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.stepn b{width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:.85rem}
.stepn b.done{background:var(--ok)}
.stepn span{font-weight:650}
.shots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:22px}
.shot{display:flex;flex-direction:column;gap:8px;min-width:0}
.shot .ph{border:1.5px dashed var(--line);display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;color:var(--muted);font-size:.86rem}
.shot .ph.has{border-style:solid;border-color:transparent;padding:0}
.shot .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:1}
.shot .ph strong{display:block;color:var(--ink);font-size:.98rem;margin-bottom:4px}
.shot label.ph{cursor:pointer;flex-direction:column;gap:8px}
.shot label.ph svg{stroke:var(--navy)}
.shot label.ph input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;z-index:2}
.shot .redo{position:absolute;right:8px;top:8px;z-index:1;background:rgba(14,19,29,.7);color:#fff;font-size:.75rem;padding:3px 9px;border-radius:999px}
.shot .side-l{position:absolute;left:8px;bottom:8px;background:rgba(14,19,29,.7);color:#fff;font-size:.75rem;padding:3px 9px;border-radius:999px}
.field{margin-bottom:16px}
.field>label,.field>.lbl{display:block;font-weight:600;font-size:.92rem;margin-bottom:7px;color:var(--ink-2)}
.field input[type=text]{width:100%;height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.field .chips{flex-wrap:wrap;overflow:visible;padding:0}
.hint{font-size:.82rem;color:var(--muted);margin:6px 0 0}
.dshots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:18px}
.dshots figure{margin:0;min-width:0}
.dshots figcaption{font-size:.8rem;color:var(--muted);margin-top:5px}
.strip{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:18px;margin:0 -18px 16px;padding:0 18px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip figure{flex:0 0 72%;min-width:0;scroll-snap-align:start;margin:0}
.strip figcaption{font-size:.85rem;margin-top:6px;color:var(--ink-2)}
.list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.li{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:12px;padding:8px;border:0;text-align:left;width:100%}
.li .ph{width:52px;aspect-ratio:1;flex:none;border-radius:8px}
.li div:last-child{min-width:0}
.li b{display:block;font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li span{font-size:.8rem;color:var(--muted)}
.me{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:var(--r-md);padding:14px;margin-bottom:16px}
.me .acct{width:48px;height:48px}
.me b{display:block}
.me span{font-size:.85rem;color:var(--muted);word-break:break-all}

/* Écran de connexion */
.gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px calc(24px + env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) calc(24px + env(safe-area-inset-left,0px))}
.gate-in{width:100%;max-width:360px;text-align:center}
.gate-in img{width:84px;height:84px;border-radius:20px;margin:0 auto 18px;box-shadow:var(--shadow)}
.gate h1{font-size:2.6rem;line-height:1;margin:0 0 8px;font-weight:800;letter-spacing:-.035em}
.gate p{color:var(--muted);margin:0 0 26px}
.gbtn{width:100%;border:0;border-radius:var(--r-md);min-height:54px;background:var(--surface);color:var(--ink);font-weight:700;display:flex;align-items:center;justify-content:center;gap:12px;box-shadow:inset 0 0 0 1px var(--line),var(--shadow)}
.gate .err{color:var(--danger);font-size:.88rem;margin:14px 0 0;min-height:1.2em}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:.9rem;font-weight:600;z-index:60;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;display:flex;align-items:center;gap:8px;max-width:90vw;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast svg{stroke:currentColor}
@media (min-width:760px){.wrap{padding-left:28px;padding-right:28px}.grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

/* Titres en DM Serif Display */
h1,h2,h3,.sheet-h h2{font-family:var(--serif);font-weight:400!important;letter-spacing:0!important}
.brand h1,.gate h1{letter-spacing:-.01em!important}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-shirt" viewBox="0 0 24 24"><path fill="none" stroke-width="1.7" stroke-linejoin="round" d="M8 3 4 5 2 9.5l3 1.5 1-1.5V21h12V9.5l1 1.5 3-1.5L20 5l-4-2a4 4 0 0 1-8 0Z"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path fill="none" stroke-width="1.7" stroke-linejoin="round" d="m12 3 9 5-9 5-9-5 9-5Zm-9 9 9 5 9-5M3 16l9 5 9-5"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path stroke-width="1.8" stroke-linejoin="round" d="M12 20s-7.5-4.6-9.2-9.3C1.6 7.3 3.9 4 7.3 4c2 0 3.5 1.1 4.7 2.8C13.2 5.1 14.7 4 16.7 4c3.4 0 5.7 3.3 4.5 6.7C19.5 15.4 12 20 12 20Z"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path fill="none" stroke-width="2.2" stroke-linecap="round" d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path fill="none" stroke-width="2" stroke-linecap="round" d="M6 6l12 12M18 6 6 18"/></symbol>

/* Compression : photo réduite (900 px, JPEG) pour rester léger dans la base */
async function compress(file, max=900){
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error("decode")); i.src=url; });
    const k = Math.min(1, max/Math.max(img.naturalWidth,img.naturalHeight));
    const cv = document.createElement("canvas");
    cv.width = Math.max(1,Math.round(img.naturalWidth*k)); cv.height = Math.max(1,Math.round(img.naturalHeight*k));
    cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
    return {data: cv.toDataURL("image/jpeg",0.72), color: detectColor(cv)};
  } finally { URL.revokeObjectURL(url); }
}
function detectColor(cv){
  try{
    const w=cv.width,h=cv.height, d=cv.getContext("2d",{willReadFrequently:true}).getImageData(0,0,w,h).data;
    const px=(x,y)=>{ const i=(y*w+x)*4; return [d[i],d[i+1],d[i+2]]; };
    const key=c=>(c[0]>>4)+","+(c[1]>>4)+","+(c[2]>>4);
    const fb={}; const stepB=Math.max(1,Math.round((w+h)/200));
    for(let x=0;x<w;x+=stepB){ for(const y of [1,h-2]){ const k=key(px(x,y)); fb[k]=(fb[k]||0)+1; } }
    for(let y=0;y<h;y+=stepB){ for(const x of [1,w-2]){ const k=key(px(x,y)); fb[k]=(fb[k]||0)+1; } }
    const bg=Object.entries(fb).sort((a,b)=>b[1]-a[1])[0][0].split(",").map(v=>v*16+8);
    const b={}; const step=Math.max(1,Math.round(Math.min(w,h)/90));
    for(let y=0;y<h;y+=step) for(let x=0;x<w;x+=step){
      const c=px(x,y); if(Math.abs(c[0]-bg[0])+Math.abs(c[1]-bg[1])+Math.abs(c[2]-bg[2])<60) continue;
      const cx=Math.abs(x/w-.5), cy=Math.abs(y/h-.5); const wgt=cx<.25&&cy<.25?2:1;
      const k=key(c); b[k]=(b[k]||0)+wgt;
    }
    const ent=Object.entries(b).sort((a,c)=>c[1]-a[1]);
    const top=(ent.length?ent[0][0]:key(px(w>>1,h>>1))).split(",").map(v=>v*16+8);
    let best=null, bd=Infinity;
    for(const c of COLORS){ if(c.multi) continue;
      const r=parseInt(c.hex.slice(1,3),16), g=parseInt(c.hex.slice(3,5),16), bl=parseInt(c.hex.slice(5,7),16);
      const dist=2*(top[0]-r)**2+4*(top[1]-g)**2+3*(top[2]-bl)**2; if(dist<bd){bd=dist;best=c.n;} }
    return best;
  }catch(e){ return null; }
}

const PC = {
  mem:new Map(), pending:new Map(), idb:null,
  async open(){
    try{ this.idb = await new Promise((res,rej)=>{ const r=indexedDB.open("penderie-photos",1); r.onupgradeneeded=()=>r.result.createObjectStore("p"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }catch(e){ this.idb=null; }
  },
  _tx(mode,fn){ return new Promise((res,rej)=>{ try{ const r=fn(this.idb.transaction("p",mode).objectStore("p")); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }catch(e){ rej(e); } }); },
  put(pid,v){ this.mem.set(pid,v); if(this.idb) this._tx("readwrite",o=>o.put(v,pid)).catch(()=>{}); },
  del(pid){ this.mem.delete(pid); if(this.idb) this._tx("readwrite",o=>o.delete(pid)).catch(()=>{}); },
  get(pid){
    if(!pid) return Promise.resolve(null);
    if(this.mem.has(pid)) return Promise.resolve(this.mem.get(pid));
    if(this.pending.has(pid)) return this.pending.get(pid);
    const p=(async()=>{
      let v=null;
      if(this.idb){ try{ v=await this._tx("readonly",o=>o.get(pid)); }catch(e){} }
      if(!v && Store.base){ try{ v=(await get(ref(db,`${Store.base}/photos/${pid}`))).val(); }catch(e){} if(v) this.put(pid,v); }
      if(v) this.mem.set(pid,v);
      this.pending.delete(pid); return v;
    })();
    this.pending.set(pid,p); return p;
  }
};
function hydrate(){

}

      this.unsubs.push(onValue(ref(db,this.base+"/items"),s=>{

      },fail));
      this.unsubs.push(onValue(ref(db,this.base+"/outfits"),s=>{
        const v=s.val()||{}; this.outfits=Object.entries(v).map(([id,x])=>({...x,id,itemIds:x.itemIds||[]})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)); gotO=true; ready();
      },fail));
    });
  },
  stop(){ this.unsubs.forEach(u=>u()); this.unsubs=[]; this.items=[]; this.outfits=[]; this.base=null; this.mode="init"; },
  async addItem(meta, front, back){
    const id="i"+uid(), f="p"+uid(), b="p"+uid();
    PC.put(f,front); PC.put(b,back);

    return set(ref(db,`${this.base}/items/${id}`),clean);
  },
  deleteItem(it){

    this.outfits.filter(o=>o.itemIds.includes(it.id)).forEach(o=>up[`outfits/${o.id}`]=null);
    PC.del(it.frontId); PC.del(it.backId);

  },

};

/* ===== Moteur de tenues ===== */
function seasonOK(it){
  const s=it.seasons||[];
  if(ui.fWeather==="Toutes"||!s.length) return true;
  if(ui.fWeather==="Chaud") return s.includes("Été");
  if(ui.fWeather==="Froid") return s.includes("Hiver")||s.includes("Mi-saison");
  return s.includes("Mi-saison");
}
const hueDist=(a,b)=>{ const d=Math.abs(a-b)%360; return d>180?360-d:d; };
function colorScore(items){
  const cols=items.map(i=>C[i.color]).filter(Boolean);
  const multi=cols.filter(c=>c.multi).length;
  const bold=[...new Set(cols.filter(c=>c.hue!==undefined).map(c=>c.n))];
  const names=cols.map(c=>c.n);
  let s=0, label="";
  if(multi>1) return {s:-9,label:""};
  if(multi===1){ if(bold.length) return {s:-9,label:""}; s+=1.4; label="Imprimé sur base neutre"; }
  else if(!bold.length){
    const tones=new Set(cols.map(c=>c.tone)); const uniq=new Set(names).size;
    if(uniq===1){ s+=1.5; label="Total look "+names[0].toLowerCase(); }
    else if(tones.has("dark")&&tones.has("light")){ s+=1.6; label="Contraste neutre"; }
    else { s+=1.1; label="Base neutre"; }
  } else if(bold.length===1){
    const k=names.filter(n=>n===bold[0]).length;
    s+=k>1?1.7:2.2; label=k>1?`Ton sur ton ${bold[0].toLowerCase()}`:`Touche de ${bold[0].toLowerCase()}`;
  } else if(bold.length===2){
    const d=hueDist(C[bold[0]].hue,C[bold[1]].hue);
    if(d<=45){ s+=1.3; label="Couleurs voisines"; }
    else if(d>=140){ s+=.8; label="Couleurs complémentaires"; }
    else return {s:-9,label:""};
  } else return {s:-9,label:""};
  if(names.includes("Noir")&&names.includes("Marine")) s-=.6;
  if(names.includes("Noir")&&names.includes("Marron")) s-=.4;
  return {s,label};
}
const pick=a=>a[Math.floor(Math.random()*a.length)];
/* Chaleur d'un vêtement : "chaud" = été seulement, "froid" = hiver seulement, null = polyvalent */
const HOT_RX=/bain|maillot|débardeur|debardeur|tong|claquette|sandale|short|bermuda|lin\b/;
const COLD_RX=/doudoune|parka|manteau|puffer|polaire|fourr|bonnet|écharpe|echarpe|\bgants?\b|laine|col roul|moon ?boot|bottes? fourr/;
function warmth(i){
  const s=i.seasons||[], nm=(i.name||"").toLowerCase();
  if(s.length===1&&s[0]==="Été") return "chaud";
  if(s.length===1&&s[0]==="Hiver") return "froid";
  if(i.type==="Short"||HOT_RX.test(nm)) return "chaud";
  if(i.type==="Pull"||COLD_RX.test(nm)) return "froid";
  return null;
}
function coherent(items){
  const w=items.map(warmth);
  if(w.includes("chaud")&&w.includes("froid")) return false;
  const ss=items.map(i=>i.seasons||[]).filter(x=>x.length);
  for(let a=0;a<ss.length;a++) for(let b=a+1;b<ss.length;b++) if(!ss[a].some(x=>ss[b].includes(x))) return false;
  return true;
}
function weatherOK(i){
  const w=warmth(i);
  if(ui.fWeather==="Chaud") return w!=="froid";
  if(ui.fWeather==="Froid") return w!=="chaud";
  return true;
}
function generate(){
  const A=ui.anchorId?item(ui.anchorId):null; if(!A) ui.anchorId=null;
  const pool=Store.items.filter(i=>i===A||(seasonOK(i)&&weatherOK(i)));
  const by=t=>pool.filter(i=>i.type===t);
  let tops=pool.filter(i=>TOPS.includes(i.type)), bottoms=pool.filter(i=>BOTTOMS.includes(i.type)), ones=by("Une-pièce"), shoes=by("Chaussures"), outers=by("Veste"), accs=by("Accessoire"), belts=by("Ceinture");
  if(A){
    if(TOPS.includes(A.type)){ tops=[A]; ones=[]; }
    else if(BOTTOMS.includes(A.type)){ bottoms=[A]; ones=[]; }
    else if(A.type==="Une-pièce"){ ones=[A]; tops=[]; bottoms=[]; }
    else if(A.type==="Chaussures") shoes=[A];
    else if(A.type==="Veste") outers=[A];
    else if(A.type==="Ceinture") belts=[A];
    else if(A.type==="Accessoire") accs=[A];
  }
  const st=$("#genStatus");
  if(!shoes.length || (!ones.length && (!tops.length||!bottoms.length))){
    const miss=[]; if(!tops.length&&!ones.length) miss.push("un haut"); if(!bottoms.length&&!ones.length) miss.push("un bas"); if(!shoes.length) miss.push("des chaussures");
    st.textContent=`Il manque ${miss.join(", ")}${ui.fWeather!=="Toutes"?" adaptés à cette météo":""} pour composer une tenue.`;
    ui.generated=[]; renderResults(); return;
  }
  if(ui.fStyle!=="Tous" && ![...tops,...bottoms,...ones].some(i=>i.style===ui.fStyle)){
    st.textContent=`Aucun haut ni bas de style ${ui.fStyle} dans ta penderie${ui.fWeather!=="Toutes"?" pour cette météo":""}.`; ui.generated=[]; renderResults(); return;
  }
  const seen=new Set(), out=[];
  for(let t=0;t<3000;t++){
    const useOne = ones.length && (!tops.length||!bottoms.length||Math.random()<ones.length/(ones.length+tops.length));
    const base = useOne?[pick(ones)]:[pick(tops),pick(bottoms)];
    const anchor = ui.fStyle!=="Tous"?ui.fStyle:base[0].style;
    const ok = STYLE_COMPAT[anchor]||[anchor];
    if(!base.every(i=>ok.includes(i.style))) continue;
    if(ui.fStyle!=="Tous" && !base.some(i=>i.style===ui.fStyle)) continue;
    const fit=i=>ok.includes(i.style);
    if(!coherent(base)) continue;
    const sh=shoes.filter(fit).filter(x=>coherent([...base,x])); if(!sh.length) continue;
    const items=[...base,pick(sh)];
    const ou=outers.filter(fit);
    const wantOuter={Froid:1,Chaud:0,"Mi-saison":.7,Toutes:.4}[ui.fWeather];
    const hot=items.some(i=>warmth(i)==="chaud");
    const ou2=ou.filter(o=>!hot||warmth(o)!=="froid");
    if(A?.type==="Veste"){ if(!ou2.includes(A)) continue; items.push(A); }
    else if(ou2.length && Math.random()<(hot?0:wantOuter)) items.push(pick(ou2));
    const bas = useOne ? null : base[1];
    const nm = (bas?.name||"").toLowerCase();
    const loops = bas && bas.style!=="Sport" && (
      LOOPS.includes(bas.type) ||
      (bas.type==="Short" && !/bain|sport/.test(nm)) ||
      (bas.type==="Bas" && (cols(bas).includes("Denim") || /jean|pantalon|chino|cargo|costume/.test(nm))));
    const needBelt = loops;
    const bl=belts.filter(fit).filter(x=>coherent([...items,x])); if(A?.type==="Ceinture"){ if(!needBelt||!bl.includes(A)) continue; items.push(A); }
    else if(bl.length && needBelt) items.push(pick(bl));
    const ac=accs.filter(fit).filter(a=>coherent([...items,a])); if(A?.type==="Accessoire"){ if(!ac.includes(A)) continue; items.push(A); }
    else if(ac.length && Math.random()<.4) items.push(pick(ac));
    if(!coherent(items)) continue;
    if(ui.fColor!=="Toutes" && !items.some(i=>cols(i).includes(ui.fColor))) continue;
    const key=items.map(i=>i.id).sort().join("|"); if(seen.has(key)) continue; seen.add(key);
    const cs=colorScore(items); if(cs.s<0) continue;
    const styleBonus=new Set(items.map(i=>i.style)).size===1?.8:0;
    out.push({key,itemIds:items.map(i=>i.id),score:cs.s+styleBonus+Math.random()*2.5,name:base.map(i=>i.name||i.type).join(" et "),label:cs.label,why:""});
  }
  const total=out.length;
  const recent=new Set(ui.recent||[]);
  const fresh=out.filter(f=>!recent.has(f.key));
  const src = fresh.length>=6 ? fresh : [...fresh, ...out.filter(f=>recent.has(f.key))];
  if(fresh.length<6) ui.recent=[];
  out.length=0; out.push(...src);
  // Tirage vraiment aléatoire : chaque haut a la même chance, sans répéter haut ni bas
  const shuf=arr=>{ for(let k=arr.length-1;k>0;k--){ const j=Math.floor(Math.random()*(k+1)); [arr[k],arr[j]]=[arr[j],arr[k]]; } return arr; };
  const groups={}; out.forEach(f=>{ const g=f.itemIds[0]===A?.id?(f.itemIds[1]||f.itemIds[0]):f.itemIds[0]; (groups[g]=groups[g]||[]).push(f); });
  Object.values(groups).forEach(shuf);
  const chosen=[], usedB=new Set();
  for(let pass=0;pass<2&&chosen.length<6;pass++){
    for(const g of shuf(Object.keys(groups))){
      if(chosen.length>=6) break;
      if(pass===0 && chosen.some(f=>f._g===g)) continue;
      const list=groups[g].filter(f=>!chosen.includes(f));
      const f=list.find(f=>pass>0||!usedB.has(f.itemIds[1])) || (pass>0?list[0]:null);
      if(!f) continue; f._g=g; usedB.add(f.itemIds[1]); chosen.push(f);
    }
  }
  if(chosen.length<6) for(const f of shuf(out)){ if(chosen.length>=6) break; if(!chosen.includes(f)) chosen.push(f); }
  ui.generated=chosen;
  ui.recent=[...(ui.recent||[]),...chosen.map(f=>f.key)].slice(-60);
  st.textContent = chosen.length ? `${A?`Avec ${A.name||A.type} : `:""}${plural(chosen.length,"tenue proposée","tenues proposées")}${total>chosen.length?" (il y en a beaucoup d'autres)":""}. Relance pour en voir d'autres.` : "Aucune combinaison harmonieuse avec ces critères. Élargis le style, la météo ou la couleur.";
  renderResults();
  if(chosen.length) $("#results").scrollIntoView({behavior:"smooth",block:"start"});
}

function openAdd(){
  const d={name:"",type:null,color:null,colors:[],style:null,seasons:[]}; const photos={front:null,back:null}; let colorAuto=false;
  openSheet("Nouveau vêtement", `
    <div class="shots">${shotHTML("sFront","Face","Touche pour photographier le devant, à plat sur un fond uni",1)}${shotHTML("sBack","Dos","Retourne le vêtement et photographie le dos",2)}</div>
    <div class="stepn"><b id="step3">3</b><span>Détails</span></div>
    ${formFields(d)}
    <button class="btn block" id="saveItem" disabled>Ajouter à la penderie</button>
    <p class="hint" id="saveHint" style="text-align:center"></p>`);
  const r=bindFields(d,check);
  function check(){
    const miss=[]; if(!photos.front) miss.push("photo de face"); if(!photos.back) miss.push("photo de dos"); if(!d.type) miss.push("type"); if(!d.colors.length) miss.push("couleur"); if(!d.style) miss.push("style");
    $("#saveItem").disabled=!!miss.length;
    $("#saveHint").textContent=miss.length?`Il reste : ${miss.join(", ")}.`:"";
    $("#step3").classList.toggle("done",!!(d.type&&d.colors.length&&d.style));
  }
  check();
  const bindShot=(id,which)=>{
    const box=$("#"+id), ph=box.querySelector(".ph"), inp=ph.querySelector("input");
    inp.onchange=async()=>{
      const f=inp.files[0]; if(!f) return;
      [...ph.children].forEach(c=>{ if(c!==inp) c.remove(); }); ph.classList.remove("has");
      ph.insertAdjacentHTML("afterbegin","<div>Traitement…</div>");
      try{
        const res=await compress(f); photos[which]=res.data;
        [...ph.children].forEach(c=>{ if(c!==inp) c.remove(); });
        ph.classList.add("has");
        ph.insertAdjacentHTML("afterbegin",`<img alt="" src="${res.data}"><span class="redo">Reprendre</span><span class="side-l">${which==="front"?"Face":"Dos"}</span>`);
        box.querySelector(".stepn b").classList.add("done");
        if(which==="front" && res.color && (!d.colors.length||colorAuto)){ d.colors=[res.color]; d.color=res.color; colorAuto=true; r.color(); $("#colorHint").textContent=`Couleur détectée : ${res.color}. Corrige si besoin.`; }
      }catch(e){
        [...ph.children].forEach(c=>{ if(c!==inp) c.remove(); });
        ph.insertAdjacentHTML("afterbegin","<div>Photo illisible. Touche pour en prendre une autre.</div>");
        photos[which]=null; box.querySelector(".stepn b").classList.remove("done");
      }
      inp.value=""; check();
    };
  };
  bindShot("sFront","front"); bindShot("sBack","back");
  $("#pColor").addEventListener("click",()=>{ colorAuto=false; $("#colorHint").textContent="Plusieurs choix possibles. La première choisie = couleur principale."; });
  $("#saveItem").onclick=async()=>{
    const b=$("#saveItem"); b.disabled=true; b.textContent="Enregistrement…";
    try{ await Store.addItem({name:d.name.trim(),type:d.type,color:d.colors[0],colors:d.colors,style:d.style,seasons:d.seasons},photos.front,photos.back); closeSheet(); toast("Ajouté à la penderie"); }
    catch(e){ b.disabled=false; b.textContent="Ajouter à la penderie"; toast("Échec de l'enregistrement, réessaie","x"); }
  };
}

function openItem(it){
  if(!it) return;
  const d={...it,colors:[...cols(it)],seasons:[...(it.seasons||[])]};
  openSheet(it.name||it.type, `
    <div class="dshots">
      <figure><div class="ph">${imgTag(FR(it),"Face")}</div><figcaption>Face</figcaption></figure>
      <figure><div class="ph">${imgTag(BK(it),"Dos")}</div><figcaption>Dos</figcaption></figure>
    </div>
    <button class="btn sec block" id="compose" style="margin-bottom:16px">${ico("shuffle",16)}Tenues avec ce vêtement</button>
    ${formFields(d)}
    <div class="row"><button class="btn" id="upd" disabled>Enregistrer les modifications</button><button class="btn danger" id="del">${ico("trash",16)}Supprimer</button></div>`);
  bindFields(d,()=>{ $("#upd").disabled=false; });
  $("#compose").onclick=()=>{ closeSheet(); ui.anchorId=it.id; ui.recent=[]; renderAnchor(); setTab("outfits"); generate(); };
  $("#upd").onclick=async()=>{ const b=$("#upd"); b.disabled=true; try{ await Store.updateItem({...d,name:(d.name||"").trim()}); closeSheet(); toast("Modifications enregistrées"); }catch(e){ b.disabled=false; toast("Échec, réessaie","x"); } };
  $("#del").onclick=async()=>{
    const b=$("#del"); if(b.dataset.c!=="1"){ b.dataset.c="1"; b.innerHTML=ico("trash",16)+"Confirmer la suppression"; return; }
    b.disabled=true;
    try{ await Store.deleteItem(it); closeSheet(); toast("Vêtement supprimé"); }catch(e){ b.disabled=false; toast("Échec, réessaie","x"); }
  };
}

function openOutfit(f){
  const items=f.itemIds.map(item).filter(Boolean).sort((a,b)=>ORDER[a.type]-ORDER[b.type]);
  const saved=f.id?f:Store.outfits.find(o=>o.key===f.key);
  openSheet(f.name, `
    ${f.why?`<p class="why" style="margin:-6px 0 14px">${esc(f.why)}</p>`:""}
    <div class="strip">${items.map(i=>`<figure><div class="ph">${imgTag(BK(i),"Dos")}</div><figcaption>${esc(i.name||i.type)}, dos</figcaption></figure>`).join("")}</div>
    <div class="list">${items.map(i=>`<button class="li" data-id="${esc(i.id)}"><div class="ph">${imgTag(FR(i))}</div><div><b>${esc(i.name||i.type)}</b><span>${esc(i.type)} · ${esc(colTxt(i))} · ${esc(i.style)}</span></div></button>`).join("")}</div>
    <button class="btn block ${saved?"sec":""}" id="favT">${ico("heart",18)}${saved?"Retirer des favoris":"Ajouter aux favoris"}</button>`);
  $$("#panel .li").forEach(b=>b.onclick=()=>openItem(item(b.dataset.id)));
  $("#favT").onclick=async()=>{
    const b=$("#favT"); b.disabled=true;
    try{ if(saved){ await Store.deleteOutfit(saved.id); toast("Retirée des favoris"); } else { await Store.saveOutfit(f); toast("Ajoutée aux favoris"); } closeSheet(); render(); }
    catch(e){ b.disabled=false; toast("Action impossible, réessaie","x"); }
  };
}

function avatarHTML(u){
  return u.photoURL ? `<img src="${esc(u.photoURL)}" alt="" referrerpolicy="no-referrer">` : esc((u.displayName||u.email||"?").trim()[0].toUpperCase());
}
function openAccount(){
  const u=currentUser; if(!u) return;
  openSheet("Mon compte", `
    <div class="me"><span class="acct">${avatarHTML(u)}</span><div><b>${esc(u.displayName||"Compte Google")}</b><span>${esc(u.email||"")}</span></div></div>
    <p class="hint" style="margin:0 0 16px">Tes vêtements et tes favoris sont enregistrés sur ce compte. Reconnecte-toi avec le même compte sur un autre appareil pour les retrouver.</p>
    <button class="btn danger block" id="logout">${ico("out",18)}Se déconnecter</button>`);
  $("#logout").onclick=async()=>{ closeSheet(); await signOut(auth); };
}

/* ===== Navigation ===== */
function setTab(t){
  ui.tab=t;
  $$(".tab").forEach(x=>x.setAttribute("aria-selected",x.dataset.tab===t));
  $("#tab-wardrobe").hidden=t!=="wardrobe"; $("#tab-outfits").hidden=t!=="outfits"; $("#tab-saved").hidden=t!=="saved";
  window.scrollTo({top:0});
}
$$(".tab").forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
$("#addBtn").onclick=()=>{ if(Store.mode==="cloud") openAdd(); };
$("#genBtn").onclick=generate;
$("#acct").onclick=openAccount;
window.addEventListener("online",()=>setSync(true));
window.addEventListener("offline",()=>setSync(false));

/* ===== Connexion Google ===== */
const gBtn=$("#gLogin"), gErr=$("#gErr");
const isStandalone = window.navigator.standalone===true || matchMedia("(display-mode: standalone)").matches;
async function login(){
  gErr.textContent=""; gBtn.disabled=true;
  const provider=new GoogleAuthProvider(); provider.setCustomParameters({prompt:"select_account"});
  try{ await signInWithPopup(auth,provider); }
  catch(e){
    if(["auth/popup-blocked","auth/operation-not-supported-in-this-environment","auth/cancelled-popup-request"].includes(e.code)){
      try{ await signInWithRedirect(auth,provider); return; }catch(e2){ e=e2; }
    }
    if(e.code!=="auth/popup-closed-by-user") gErr.textContent="Connexion impossible ("+(e.code||"erreur")+"). Réessaie.";
    gBtn.disabled=false;
  }
}

/* ===== Démarrage ===== */
render();
(async()=>{
  if(!configOK){ gErr.textContent="Config Firebase manquante : colle ta config en haut du script."; return; }
  await PC.open();
  gBtn.disabled=false; gBtn.onclick=login;
  getRedirectResult(auth).catch(e=>{ if(e?.code) gErr.textContent="Connexion impossible ("+e.code+")."; });
  onAuthStateChanged(auth, async u=>{
    currentUser=u;
    if(u){
      $("#gate").hidden=true;
      const a=$("#acct"); a.hidden=false; a.innerHTML=avatarHTML(u);
      setSync(navigator.onLine);
      await Store.start(u.uid);
      render();
    } else {
      Store.stop(); ui.generated=[];
      $("#gate").hidden=false; $("#acct").hidden=true; $("#sync").hidden=true;
      gBtn.disabled=false; render();
    }
  });
})();
</script>
</body>
</html>
